name = "pointmint-agents"
main = "src/index.js"
compatibility_date = "2025-09-01"
account_id = "9d1cf7b6ef06c392049ef4573ff4797e"
workers_dev = true

# Host persona on the home page (the founder clip + name). One switch: set to "false" to show a neutral persona instead.
[vars]
SHOW_FOUNDER = "false"
# §32 Cardinal Rule: comma-separated human ids allowed to set Trust Score vetoes (freeze/suspend/ban/clamp).
# HARD PRODUCTION GATE (2026-10-25): must be set to Michael Lebor's human id (h_…) before any live deploy to agents.pointmint.io.
# Empty = production-gate.mjs aborts `npm run deploy`. Also required for §32 Trust Score veto (/api/trust/override).
PLATFORM_OWNER_HUMAN_IDS = "h_8f0dd87584fc9f72a9"
# §39: stub|workers_ai|http — no paid key required for stub; put TRANSLATE_API_KEY via wrangler secret when enabling a live provider.
TRANSLATE_PROVIDER = "stub"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "pointmint-agents-db"
database_id = "ca35575d-0299-46cf-87f5-e122c770d607"
migrations_dir = "migrations"

[[routes]]
pattern = "agents.pointmint.io"
custom_domain = true

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Member profile photos (private bucket; served only through the Worker at /media/photos/<key>)
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pointmint-agents-photos"
